# Render Blueprint: API + background worker + Postgres.
# New → Blueprint → pick this repo. Secrets marked sync:false are prompted on first deploy.
databases:
  - name: moatmine-db
    plan: basic-256mb
    databaseName: moatmine
    user: moatmine

envVarGroups:
  - name: moatmine-shared
    envVars:
      - key: MARKET_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: AUTH_MODE
        value: clerk
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

services:
  - type: web
    name: moatmine-api
    runtime: python
    rootDir: backend
    plan: starter # free plan sleeps when idle
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head # schema first; a failed migration stops the deploy
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/ready # DB reachable and schema at the newest migration
    envVars:
      - fromGroup: moatmine-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: moatmine-db, property: connectionString }
      - key: CORS_ORIGINS
        sync: false # e.g. https://moatmine.vercel.app,tauri://localhost,http://tauri.localhost

  - type: worker
    name: moatmine-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head # safe to run twice: Postgres advisory lock in migrations/env.py
    startCommand: python -m app.worker
    envVars:
      - fromGroup: moatmine-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: moatmine-db, property: connectionString }
