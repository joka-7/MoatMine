# Tool configuration only; dependencies live in requirements*.txt (Render installs those).

[tool.ruff]
target-version = "py312"  # Render runs Python 3.12 (render.yaml)
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax (list[str], X | None)
    "B",            # likely bugs
    "BLE",          # blind `except Exception`
    "T20",          # no print
    "LOG",          # logging misuse
]
# Long lines are left to review: reflowing the existing code would bury real changes in the diff.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are meant to be used as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# tests exercise behaviour; full annotations there add noise without catching bugs
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
