# Render Blueprint: API + background worker + Postgres.
# New → Blueprint → pick this repo. Secrets marked sync:false are prompted on first deploy.
databases:
  - name: safe-algo-db
    plan: basic-256mb
    databaseName: safealgo
    user: safealgo

envVarGroups:
  - name: safe-algo-shared
    envVars:
      - key: MARKET_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: AUTH_MODE
        value: clerk
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

services:
  - type: web
    name: safe-algo-api
    runtime: python
    rootDir: backend
    plan: starter # free plan sleeps when idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - fromGroup: safe-algo-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: safe-algo-db, property: connectionString }
      - key: CORS_ORIGINS
        sync: false # e.g. https://safe-algo.vercel.app,tauri://localhost,http://tauri.localhost

  - type: worker
    name: safe-algo-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - fromGroup: safe-algo-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: safe-algo-db, property: connectionString }
