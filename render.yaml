# Render Blueprint: the API as one free web service. The database is Postgres on Neon (Render has
# no free database): DATABASE_URL is Neon's *direct* connection string, not the "-pooler" one.
# Alert passes are started by .github/workflows/alerts.yml, since free plans have no workers.
# New → Blueprint → pick this repo. Secrets marked sync:false are prompted on first deploy.
envVarGroups:
  - name: moatmine-shared
    envVars:
      - key: DATABASE_URL
        sync: false # Neon → Connection details → direct (unpooled) string, with ?sslmode=require
      - key: LOG_FORMAT
        value: json
      - key: MARKET_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: AUTH_MODE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false # comma-separated emails that may sign in; the API refuses to start if this is empty
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

services:
  - type: web
    name: moatmine-api
    runtime: python
    rootDir: backend
    plan: free # sleeps after 15 idle minutes; the next request wakes it in about a minute
    # One instance on purpose: response caches, AI quotas and rate limits live in process memory
    # (docs/HLD.md "Scaling"). Move them to Redis before raising this.
    numInstances: 1
    buildCommand: pip install -r requirements.lock # exact versions; regenerate from requirements.txt
    # migrations run at start: free instances have no pre-deploy step. A failed migration stops the
    # start, so the deploy fails; the advisory lock in migrations/env.py makes a second start wait
    # instead of migrating twice.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/ready # DB reachable and schema at the newest migration
    envVars:
      - fromGroup: moatmine-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        sync: false # e.g. https://<owner>.github.io,tauri://localhost,http://tauri.localhost
      # No background worker (none on the free plan): .github/workflows/alerts.yml calls
      # POST /internal/alerts/run with this token every trading day instead.
      - key: ALERTS_RUN_TOKEN
        sync: false # python -c "import secrets; print(secrets.token_urlsafe(32))"; same value as the GitHub secret
      - key: WORKER_INTERVAL_SECONDS
        value: "90000" # a day plus an hour: /health/worker reports stale after 3x, which covers a weekend
